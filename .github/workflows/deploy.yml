# Runs on every push to main:
#   - runs the tests and checks the app builds
#   - (optional) updates Supabase, see below
#   - publishes a small REDIRECT page on GitHub Pages, so old links to
#     henroverhoef.github.io/accountability/ go to the app's real home on Vercel.
# The app itself is built and hosted by Vercel (https://accountability-five.vercel.app),
# which rebuilds automatically on every push.
#
# The app's (public) Supabase address and key are in .env.production.
#
# OPTIONAL: with these three repository secrets it also updates Supabase automatically
# (new database migrations, server functions, the anonymous sign-in setting):
#   SUPABASE_PROJECT_REF   – qvqbnwmcordnfcttdbkg
#   SUPABASE_DB_PASSWORD   – the database password chosen when creating the project
#   SUPABASE_ACCESS_TOKEN  – from https://supabase.com/dashboard/account/tokens
# Without them, Supabase changes are applied by hand (or by Claude via the Supabase connector).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Is automatic Supabase updating set up?
        id: supa
        run: |
          if [ -n "$PROJECT_REF" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Supabase secrets not set: only building the app (that's fine)."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: supabase/setup-cli@v1
        if: steps.supa.outputs.enabled == 'true'
        with:
          version: latest

      - name: Update the database
        if: steps.supa.outputs.enabled == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy server functions
        if: steps.supa.outputs.enabled == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --yes

      - name: Supabase settings
        if: steps.supa.outputs.enabled == 'true'
        run: |
          # People join with just their name + a group code: this needs "anonymous sign-ins".
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"external_anonymous_users_enabled": true}' > /dev/null
          # Contact address included with notifications (required by Apple/Google push services).
          supabase secrets set --project-ref "$PROJECT_REF" VAPID_SUBJECT="https://${{ github.repository_owner }}.github.io"

      - name: Wake the notification function (it creates its own keys the first time)
        if: steps.supa.outputs.enabled == 'true'
        run: |
          curl -fsS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/push" \
            -H "Content-Type: application/json" \
            -d '{"type":"config"}' > /dev/null \
            || echo "::warning::The push function didn't answer yet; it will set itself up on first use."

      - name: Check the app builds
        run: npm run build

      # GitHub Pages only serves the redirect page (see redirect/index.html). The old
      # service worker file disappears, so phones that had the old copy drop it.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
