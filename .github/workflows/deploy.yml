# Does ALL the setup and deployment, every time you push to main:
#   1. runs the tests
#   2. updates the Supabase database (new files in supabase/migrations)
#   3. deploys the server functions (notifications, login codes)
#   4. switches on the Supabase setting the app needs (anonymous sign-ins)
#   5. builds the app and publishes it on GitHub Pages
#
# It needs three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_PROJECT_REF   – the 20-letter id in your Supabase project's URL
#   SUPABASE_DB_PASSWORD   – the database password you chose when creating the project
#   SUPABASE_ACCESS_TOKEN  – from https://supabase.com/dashboard/account/tokens
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check the secrets are set
        run: |
          missing=""
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See the README, step 3."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Update the database
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy server functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --yes

      - name: Supabase settings
        run: |
          # People join with just their name + a group code: this needs "anonymous sign-ins".
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"external_anonymous_users_enabled": true}' > /dev/null
          # Contact address included with notifications (required by Apple/Google push services).
          supabase secrets set --project-ref "$PROJECT_REF" VAPID_SUBJECT="https://${{ github.repository_owner }}.github.io"

      - name: Get the app's public Supabase key
        id: keys
        run: |
          key=$(curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '([.[] | select(.name == "anon")][0].api_key) // ([.[] | select(.type == "publishable")][0].api_key)')
          if [ -z "$key" ] || [ "$key" = "null" ]; then
            echo "::error::Could not read the project's anon key. Is SUPABASE_PROJECT_REF correct?"
            exit 1
          fi
          echo "anon=$key" >> "$GITHUB_OUTPUT"

      - name: Wake the notification function (it creates its own keys the first time)
        run: |
          curl -fsS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/push" \
            -H "Content-Type: application/json" -H "apikey: ${{ steps.keys.outputs.anon }}" \
            -d '{"type":"config"}' > /dev/null \
            || echo "::warning::The push function didn't answer yet; it will set itself up on first use."

      - name: Build the app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ steps.keys.outputs.anon }}
          # The site lives at https://<user>.github.io/<repo-name>/
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
